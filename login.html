<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Giriş - Büdcə İzləyicisi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 380px; border-radius: 15px;">
        <h3 class="text-center mb-3 fw-bold text-success">Sistemə Giriş</h3>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} py-2">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">İstifadəçi adı</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Şifrə</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Daxil ol</button>
        </form>
        <p class="text-center mt-3 mb-0"><a href="/register">Hesabınız yoxdur? Qeydiyyat</a></p>
    </div>
</body>
</html>
